name: Profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - scripts/profile_stats/**
      - tests/**
      - requirements.txt
      - .github/workflows/profile-stats.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render account stats
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install generator dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Require STATS_TOKEN
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "${STATS_TOKEN}" ]; then
            echo "::error::STATS_TOKEN secret is not set. Add a personal access token as a repository secret named STATS_TOKEN."
            exit 1
          fi
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Render SVG cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          rm -rf assets/profile-stats
          python -m profile_stats account --theme both --out assets/profile-stats
      - name: Publish cards to the stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -Af -- assets/profile-stats
          # The cards are not tracked on main, so the only meaningful
          # comparison is against what is already published on the stats
          # branch. A first run has nothing to fetch and always publishes.
          if git fetch --depth=1 origin stats 2>/dev/null \
            && git diff --cached --quiet FETCH_HEAD -- assets/profile-stats; then
            echo "Published cards are already current."
            exit 0
          fi
          git checkout -B stats
          git commit -m "chore(stats): update profile stats"
          git push --force origin stats
      # Re-enabling resets GitHub's 60-day inactivity rule that disables schedules; pushes to the stats branch alone may not count as activity.
      - name: Keep schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/profile-stats.yml/enable"
